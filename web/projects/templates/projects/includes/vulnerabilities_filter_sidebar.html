<aside class="opencve-cve-list-sidebar">
    <div class="box box-primary opencve-cve-sidebar-card">
        <div class="box-header with-border">
            <h3 class="box-title">Filter CVEs</h3>
        </div>
        <div class="box-body">
            <form method="get" class="opencve-project-vuln-filter-form">
                <div class="form-group">
                    <label for="id_assignee">Assignee</label>
                    {{ filter_form.assignee }}
                </div>
                <div class="form-group">
                    <label for="id_status">Status</label>
                    {{ filter_form.status }}
                </div>
                <div class="form-group">
                    <label for="id_view">View</label>
                    {{ filter_form.view }}
                </div>
                <div class="form-group">
                    <label for="id_query">Query</label>
                    {{ filter_form.query }}
                    {% if filter_form.query.errors %}
                    <div class="text-danger opencve-project-vuln-filter-error">
                        {% for error in filter_form.query.errors %}
                        {{ error }}
                        {% endfor %}
                    </div>
                    {% endif %}
                </div>
                <div class="opencve-project-vuln-filter-actions">
                    <button type="submit" class="btn btn-primary btn-primary-outline">Filter</button>
                    <a href="{% url 'project_vulnerabilities' org_name=request.current_organization.name project_name=project.name %}"
                       class="btn btn-default btn-default-outline">Clear</a>
                </div>
            </form>
        </div>
    </div>
</aside>
