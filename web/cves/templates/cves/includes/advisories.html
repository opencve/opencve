{% load opencve_extras %}

{% if cve.advisories %}
<div class="box box-primary" id="cve-advisories">
    <div class="box-header">
        <h3 class="box-title">Advisories</h3>
    </div>
    <div class="box-body">
        <table class="table table-striped table-bordered">
            <thead>
                <th class="col-md-2">Source</th>
                <th class="col-md-2">ID</th>
                <th class="col-md-8">Title</th>
            </thead>
            <tbody>
            {% for advisory in cve.advisories|dictsort:"source" %}
            <tr>
                <td>{% advisory_source_display advisory.source %}</td>
                <td><a href="{{ advisory.url }}" target="_blank">{{ advisory.id }}</a></td>
                <td>{{ advisory.title }}</td>
            </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% else %}
<div class="box box-primary opencve-cve-section-empty" id="cve-advisories">
    <div class="box-header opencve-cve-section-empty-header">
        <h3 class="box-title">Advisories</h3>
        <span class="opencve-cve-section-empty-message pull-right">No advisories available</span>
    </div>
</div>
{% endif %}
